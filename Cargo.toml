[package]
name = "claude-usage"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Check usage / limits across multiple Claude Max accounts, and switch between them."

[[bin]]
name = "claude-usage"
path = "src/main.rs"

[features]
default = [
    "claude",
    "codex",
    "opencode",
    "gemini-cli",
    "qwen-code",
    "copilot-cli",
    "cursor-agent",
    "amazon-q",
    "cline",
    "grok",
    "kimi",
    "openrouter",
    "deepseek",
    "zai",
    "fireworks",
    "synthetic",
    "vertex-ai",
]
claude = []
codex = []
opencode = []
gemini-cli = []
qwen-code = []
copilot-cli = []
cursor-agent = []
amazon-q = []
cline = []
grok = []
kimi = []
openrouter = []
deepseek = []
zai = []
fireworks = []
synthetic = []
vertex-ai = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
fs2 = "0.4"
tray-icon = "0.24.2"
# Desktop notifications for the notifications module. Best-effort — a broken
# dbus / user-notification connection never fails a watch cycle.
notify-rust = "4"

# macOS menu bar is driven by a native NSApplication run loop (no tao): tao added
# its run-loop observer to kCFRunLoopCommonModes, which fires during a status
# menu's NSEventTrackingRunLoopMode and dismisses the open menu. A native loop
# plus an NSTimer scheduled in the default mode only avoids that entirely.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSTimer",
    "NSRunLoop",
    "NSDate",
    "NSString",
    "NSAttributedString", # NSMutableAttributedString + addAttribute_value_range
    "NSArray",            # tab-stops array
    "NSDictionary",       # empty NSTextTab options dict
    "NSGeometry",         # NSRange (re-exported at crate root)
    "NSData",             # NSImage::initWithData for bundled provider PNGs
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSMenu",             # walk the native menu + submenus
    "NSMenuItem",         # setAttributedTitle
    "NSFont",             # bold system font (active row)
    "NSColor",            # systemOrange/systemRed (usage bands)
    "NSParagraphStyle",   # NSTextTab right-align tab stop
    "NSText",             # NSTextAlignment
    "NSAttributedString", # attribute-name constants live here
    "NSImage",            # 16px provider icons on section header rows
    "objc2-core-foundation", # REQUIRED: CGFloat-typed methods are cfg-gated on it
] }
block2 = "0.6"
libc = "0.2" # getuid() for the launchctl kickstart restart target

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
