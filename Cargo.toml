[package]
name = "usagio"
version = "0.5.6"
edition = "2021"
rust-version = "1.88"
description = "Track usage / limits across every AI coding CLI you use, and switch between accounts."
homepage = "https://usagio.dev"
repository = "https://github.com/MattJackson/claude-usage"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["claude", "codex", "usage", "menubar", "macos"]

[[bin]]
name = "usagio"
path = "src/main.rs"

[features]
default = [
    "claude",
    "codex",
    "opencode",
    "gemini-cli",
    "qwen-code",
    "copilot-cli",
    "cursor-agent",
    "amazon-q",
    "cline",
    "grok",
    "kimi",
    "openrouter",
    "deepseek",
    "zai",
    "fireworks",
    "synthetic",
    "vertex-ai",
]
# Opt in to real OpenAI tokenization (o200k_base BPE) for Context Ledger. Off by
# default — the ~2MB tiktoken binary cost isn't worth it for a ±20% signal that
# the fallback (chars/3.6) already provides.
tiktoken = ["dep:tiktoken-rs"]
claude = []
codex = []
opencode = []
gemini-cli = []
qwen-code = []
copilot-cli = []
cursor-agent = []
amazon-q = []
cline = []
grok = []
kimi = []
openrouter = []
deepseek = []
zai = []
fireworks = []
synthetic = []
vertex-ai = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
fs2 = "0.4"
tray-icon = "0.24.2"
# Desktop notifications for the notifications module. Best-effort — a broken
# dbus / user-notification connection never fails a watch cycle.
notify-rust = "4"
# fsnotify (filesystem change notifications) for the credential-sync layer:
# watches every provider's credential_paths and drives absorb_all_lagging +
# refresh_inactive_if_stale in response to vendor-CLI rotations.
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }

# Context Ledger deps: home/config discovery, typed errors, TOML config parsing
# (Codex config.toml), and optional real tokenization behind the `tiktoken`
# feature. The fallback path (chars-per-token approximation) works without it.
dirs = "6"
thiserror = "1"
toml = "0.8"
tiktoken-rs = { version = "0.7", optional = true }

# Native file-open/save dialogs. Cross-platform (Win32 IFileOpenDialog /
# IFileSaveDialog on Windows, NSOpenPanel/NSSavePanel on macOS, xdg-desktop-portal
# on Linux) — no per-OS wiring needed in `src/platform/`. Used by the menu-bar
# "Advanced ▸ Backups ▸ Save…/Restore…" flow and `src/platform/windows.rs::pick_file`.
# `default-features = false` + explicit features picks the lightest working
# backend per OS (no GTK on Linux, no Cocoa duplicate deps on macOS).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "common-controls-v6"] }

# macOS menu bar is driven by a native NSApplication run loop (no tao): tao added
# its run-loop observer to kCFRunLoopCommonModes, which fires during a status
# menu's NSEventTrackingRunLoopMode and dismisses the open menu. A native loop
# plus an NSTimer scheduled in the default mode only avoids that entirely.
# Unix-common bits (macOS + Linux). libc for getrlimit/setrlimit
# (raise_nofile_limit in main.rs, #[cfg(unix)]-guarded) and getuid where
# needed. Windows has neither.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSTimer",
    "NSRunLoop",
    "NSDate",
    "NSString",
    "NSAttributedString", # NSMutableAttributedString + addAttribute_value_range
    "NSArray",            # tab-stops array
    "NSDictionary",       # empty NSTextTab options dict
    "NSGeometry",         # NSRange (re-exported at crate root)
    "NSData",             # NSImage::initWithData for bundled provider PNGs
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSMenu",             # walk the native menu + submenus
    "NSMenuItem",         # setAttributedTitle
    "NSFont",             # bold system font (active row), menu font (measurement)
    "NSColor",            # systemOrange/systemRed (usage bands)
    "NSParagraphStyle",   # NSTextTab right-align tab stop
    "NSText",             # NSTextAlignment
    "NSAttributedString", # attribute-name constants live here
    "NSStringDrawing",    # NSAttributedString::size() — measures a row's
                           # natural width so the right-align tab stop can be
                           # computed dynamically per snapshot instead of a
                           # fixed magic number (v0.5.1)
    "NSImage",            # 16px provider icons on section header rows
    "objc2-core-foundation", # REQUIRED: CGFloat-typed methods are cfg-gated on it
] }
block2 = "0.6"

# Linux platform impl deps. Only pulled in when building for Linux — cargo
# skips these on macOS/Windows targets. See src/platform/linux.rs for the
# real impls (tray + GTK loop, Secret Service + file fallback, XDG autostart,
# XDG paths).
[target.'cfg(target_os = "linux")'.dependencies]
# `tray-icon` (top-level dep, shared with macOS/Windows) is backed on Linux by
# `libappindicator`/`libayatana-appindicator3`, itself a GTK status-icon
# wrapper — an actual GTK main loop has to run on the thread that created the
# tray icon. `gtk`/`glib` are pulled in only to drive that loop; tray-icon
# owns the appindicator plumbing itself. Version pinned to what tray-icon
# 0.24's own examples build against.
gtk = "0.18"
# Per-account secret storage: prefers the Secret Service D-Bus daemon (GNOME
# Keyring / KWallet) via keyring's pure-Rust `async-secret-service` backend
# (zbus-based — no libdbus C dependency to cross-compile, and no
# tokio-on-the-main-thread deadlock risk the crate's own docs warn about for
# the `tokio` runtime feature). Falls back to an on-disk file when no daemon
# is reachable (headless servers) — see `LinuxSecrets` below.
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io"] }
# `keyring`'s `async-secret-service` feature pulls in `secret-service` without
# picking one of its required `rt-*` runtime+crypto features (it's a compile
# error otherwise: "Please enable a feature to pick a runtime for the
# secret-service crate"). We never call `secret-service` directly — this
# entry exists purely so Cargo's feature unification hands keyring's copy of
# the crate the `async-io` runtime (matching `keyring`'s own `async-io`
# feature above) and a pure-Rust crypto backend (`crypto-rust`, no system
# OpenSSL needed to cross-compile).
secret-service = { version = "4", default-features = false, features = ["rt-async-io-crypto-rust"] }
# Decodes the bundled 16x16 provider PNGs into the raw RGBA tray-icon needs.
# Pure Rust, no system libpng dependency.
png = "0.18"
# File dialogs (Backups Save/Restore in the tray menu) via the
# xdg-desktop-portal — works across GNOME/KDE/Sway. The portal round-trip
# uses rfd's own dlopen'd libdbus binding (no link-time C dep); "wayland" is
# left off since the portal path doesn't need direct Wayland surface access.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# Windows platform impl deps. Same story as the Linux block — only fetched
# when the target is Windows.
[target.'cfg(target_os = "windows")'.dependencies]
# Only the pieces `src/platform/windows.rs` actually calls: MSG / HWND types
# and the GetMessage/PeekMessage/DispatchMessage pump the tray-icon window
# needs driven from our own event loop. Credential storage goes through
# `keyring` (Credential Manager) and the registry Run key goes through
# `winreg`, so we don't hand-roll those Win32 calls ourselves.
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# Credential Manager-backed secret storage (Platform::secrets()). `v1` gives
# the simple Entry::new/get_password/set_password/delete_credential surface;
# `windows-native-keyring-store` is the only backend we need on this target.
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }
# HKCU\...\Run key read/write for autostart — a thin, well-tested wrapper
# over RegOpenKeyEx/RegSetValueEx/RegDeleteValue so we don't hand-roll UTF-16
# buffer management for the registry API.
winreg = "0.56"
# Probe PATH for wt.exe / cmd.exe / powershell.exe when picking a terminal to
# launch a vendor CLI REPL in.
which = "8"
# Decode whatever icon bytes the caller hands `MenuHandle::set_icon` (ICO/BMP
# per the trait doc, but PNG works too) into the raw RGBA buffer tray-icon's
# `Icon::from_rgba` wants.
image = { version = "0.25", default-features = false, features = [
    "ico",
    "png",
    "bmp",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
