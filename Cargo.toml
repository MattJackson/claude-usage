[package]
name = "claude-usage"
version = "0.1.4"
edition = "2021"
description = "Check usage / limits across multiple Claude Max accounts, and switch between them."

[[bin]]
name = "claude-usage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["clock"], default-features = false }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tray-icon = "0.24.2"
tao = "0.37.0"

# macOS: set the app's activation policy to Accessory (menu-bar only, no Dock
# icon) at runtime. These crates are already in the tree via tray-icon/tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
