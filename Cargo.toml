[package]
name = "claude-usage"
version = "0.1.2"
edition = "2021"
description = "Check usage / limits across multiple Claude Max accounts, and switch between them."

[[bin]]
name = "claude-usage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tray-icon = "0.24.2"
tao = "0.37.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
