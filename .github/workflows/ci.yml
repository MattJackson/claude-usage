name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast lane — runs on every push/PR (including dev), across all three
  # platforms usagio ships on. Keeps dev quick per-OS while still catching
  # platform-specific breakage before it reaches qa/main.
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux-only system deps: tray-icon (GTK/appindicator), notify-rust
      # (dbus via libxdo for some backends), ureq TLS (openssl), and the
      # secret-service crate (libsecret) for the credential store.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config libsecret-1-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --all-features

      - name: cargo test
        # --test-threads=1 required: several tests mutate process-global $HOME
        # to point at a tempdir via env_lock::scoped_env_var. Parallel runs
        # would race the lock across binaries. See M7 in the round-1 codeaudit.
        #
        # Includes `tests/strict_cfg.rs`, which enforces the "no scattered
        # `#[cfg(target_os)]` outside src/platform/*" rule with a proper
        # allowlist and comment-skipping logic (the previous naive shell
        # `grep` version tripped on doc comments that mention the string
        # `cfg(target_os = ...)` as example text — false positives).
        run: cargo test --tests --all-features -- --test-threads=1

      # H4 (v0.5.0 codeaudit): release.yml's macOS build job calls
      # packaging/macos/generate-icns.sh, which shells out to `rsvg-convert`
      # (from librsvg) and dies loudly if it's missing. release.yml didn't
      # install it, so the FIRST v0.5.0 tag push would have failed here —
      # after the build/package steps already ran — aborting the whole
      # release (no artifacts, no tap bump). Running the script itself on
      # every push (not just a release-tag push) catches that class of
      # regression immediately instead of only at tag-push time.
      - name: Install librsvg for icon generation
        if: matrix.os == 'macos-latest'
        run: brew install librsvg

      - name: Verify packaging/macos/generate-icns.sh runs end-to-end
        if: matrix.os == 'macos-latest'
        run: packaging/macos/generate-icns.sh

  # Full lane — release build, only on the qa and main branches.
  build:
    name: release build
    if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build --release
        run: cargo build --release --locked
