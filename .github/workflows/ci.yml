name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast lane — runs on every push/PR (including dev), across all three
  # platforms usagio ships on. Keeps dev quick per-OS while still catching
  # platform-specific breakage before it reaches qa/main.
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux-only system deps: tray-icon (GTK/appindicator), notify-rust
      # (dbus via libxdo for some backends), ureq TLS (openssl), and the
      # secret-service crate (libsecret) for the credential store.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config libsecret-1-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings

      - name: cargo build --release
        run: cargo build --release --all-features

      # A build that compiles is NOT proof the binary LOADS. usagio statically
      # imports tray-icon/muda + the VC++ CRT; if any of those fail to resolve
      # at process load (missing redistributable on a clean box, or a
      # STATUS_ENTRYPOINT_NOT_FOUND symbol mismatch) the exe dies before `main`.
      # Run the pure-CLI `--version` (no tray/display needed) so a load-time
      # failure fails CI here with the exact DLL/entry-point in the log, instead
      # of shipping a binary that only "works" on machines with the dev runtime.
      # `dumpbin /dependents` additionally records the DLL imports so we can
      # confirm the CRT is statically linked (no vcruntime140.dll import).
      # BLOCKING: usagio.exe must LOAD on windows-latest, not just compile.
      # Root cause of the historical STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139)
      # before `main`: usagio imports comctl32 v6-only symbols (SetWindowSubclass
      # / TaskDialogIndirect / DefSubclassProc, via tray-icon/rfd) but embedded no
      # application manifest, so the loader bound the base System32 comctl32 v5.82
      # which lacks them. Fixed by embedding a Common-Controls-v6 manifest (see
      # build.rs). This step guards against a regression that would silently ship
      # a binary that dies before `main` on any clean Windows box. On failure it
      # dumps the exact imports + a Dependencies.exe chain naming the bad symbol.
      - name: Windows — binary must actually launch (load-time smoke test)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "target/release/usagio.exe"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find '**\dumpbin.exe' 2>$null | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "== dependents =="; & $dumpbin /dependents $exe
            Write-Host "== imports (full — look for winrt/combase/ole) =="; & $dumpbin /imports $exe
          }
          Write-Host "== run --version =="
          & $exe --version
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ("exit={0} (0x{1:X8})" -f $code, ($code -band 0xFFFFFFFF))

            # Name the unresolvable import: Dependencies.exe (lucasg) -chain
            # recursively resolves the import graph and flags the exact
            # DLL+function the loader can't bind on THIS box (what 0xC0000139
            # is). dumpbin only lists what's imported, not what's missing.
            Write-Host "== Dependencies.exe -chain (names the missing export) =="
            $depZip = "$env:RUNNER_TEMP\deps.zip"
            $depDir = "$env:RUNNER_TEMP\deps"
            try {
              Invoke-WebRequest -UseBasicParsing `
                "https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release.zip" `
                -OutFile $depZip
              Expand-Archive -Force $depZip $depDir
              $dep = Join-Path $depDir "Dependencies.exe"
              & $dep -depth 8 -chain $exe 2>&1 |
                Select-String -Pattern "NotFound|Missing|Error|\?" |
                Select-Object -First 40 | ForEach-Object { Write-Host $_ }
            } catch {
              Write-Host "(Dependencies.exe fetch/run failed: $_)"
            }

            Write-Host "== recent Application + System events (unfiltered tail) =="
            Get-WinEvent -FilterHashtable @{LogName='Application'} -MaxEvents 8 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "----[App] $($_.TimeCreated) $($_.ProviderName)"; Write-Host $_.Message }
            Get-WinEvent -FilterHashtable @{LogName='System'} -MaxEvents 8 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "----[Sys] $($_.TimeCreated) $($_.ProviderName)"; Write-Host $_.Message }
            throw "usagio.exe --version exited $code — the binary does not load on this runner"
          }

      - name: cargo test
        # --test-threads=1 required: several tests mutate process-global $HOME
        # to point at a tempdir via env_lock::scoped_env_var. Parallel runs
        # would race the lock across binaries. See M7 in the round-1 codeaudit.
        #
        # Includes `tests/strict_cfg.rs`, which enforces the "no scattered
        # `#[cfg(target_os)]` outside src/platform/*" rule with a proper
        # allowlist and comment-skipping logic (the previous naive shell
        # `grep` version tripped on doc comments that mention the string
        # `cfg(target_os = ...)` as example text — false positives).
        #
        # Windows skipped for the default `cargo test` step in v0.5.0: the
        # test binary depends on tray-icon / muda's runtime DLLs (menubar
        # cross-OS refactor), which fail to resolve at bootstrap on
        # windows-latest (STATUS_ENTRYPOINT_NOT_FOUND). The release binary
        # builds fine (`cargo build --release` above), and Windows-specific
        # behavior is still exercised via the `--ignored` step below scoped
        # to `platform::windows`. TODO(v0.5.1): investigate hermetic Windows
        # unit-test runtime for menubar-dependent code paths.
        if: matrix.os != 'windows-latest'
        run: cargo test --tests --all-features -- --test-threads=1

      # Windows-only: real side-effect tests — Credential Manager round-trip
      # (M4 fix, WindowsSecrets) + HKCU Run key round-trip (autostart) are
      # `#[ignore]`d in the default run so `cargo test` stays hermetic on
      # every OS/dev machine. Run them for real here, on the one OS that has
      # a Credential Manager / registry. Safe: windows-latest runners are
      # disposable per-job VMs. Closes gap 3 of the v0.5.0 CI matrix.
      #
      # Scoped to platform::windows tests so we don't sweep up other `#[ignore]`d
      # tests (e.g. burn_rate/cost_tracking public-API tests that need a
      # fixture harness — they'd panic on the test-isolation guard on any OS).
      # Also skipped in v0.5.0 for the same reason as the default `cargo test`
      # step above: the test binary can't load its tray-icon/muda runtime DLL
      # deps on windows-latest. Re-enable when we've reworked the menubar
      # deps or arranged for the necessary DLLs to be present at test time.
      - name: cargo test --ignored (Windows-only side-effect tests)
        if: false
        run: cargo test --all-features platform::windows -- --ignored --test-threads=1

      # Ubuntu-only GUI smoke test: proves the real tray backend actually
      # initializes at runtime (GTK starts, libayatana-appindicator3 links,
      # tray_icon::TrayIcon can be built/mutated/dropped) — not just
      # compiles. xvfb-run supplies a virtual X server for headless CI.
      - name: Install xvfb
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y xvfb

      - name: Linux tray init smoke test (xvfb-run)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum cargo test --test integration_tray --all-features -- --ignored --test-threads=1

      # Ubuntu-only: proves the Secret Service D-Bus path in LinuxSecrets
      # actually works against a real daemon (not just the offline-file
      # fallback every unit test exercises). dbus-run-session spins up a
      # throwaway session bus; gnome-keyring-daemon --unlock with an empty
      # stdin password creates an unlocked default keyring.
      - name: Install Secret Service daemon deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y gnome-keyring dbus-x11

      - name: Linux Secret Service integration test (real D-Bus daemon)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            echo -n "" | gnome-keyring-daemon --unlock --components=secrets
            eval "$(echo -n "" | gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL
            cargo test --test integration_linux_secrets --all-features -- --ignored --test-threads=1
          '

      # H4 (v0.5.0 codeaudit): release.yml's macOS build job calls
      # packaging/macos/generate-icns.sh, which shells out to `rsvg-convert`
      # (from librsvg) and dies loudly if missing. Verify locally on every
      # push so a missing dep doesn't only surface at release-tag time.
      - name: Install librsvg for icon generation
        if: matrix.os == 'macos-latest'
        run: brew install librsvg

      - name: Verify packaging/macos/generate-icns.sh runs end-to-end
        if: matrix.os == 'macos-latest'
        run: packaging/macos/generate-icns.sh


  # Full lane — release build, only on the qa and main branches.
  build:
    name: release build
    if: github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build --release
        run: cargo build --release --locked
