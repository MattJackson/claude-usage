name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  BIN: claude-usage

jobs:
  release:
    name: Build universal macOS binary and publish release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          # Both Apple architectures so we can lipo a universal binary.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$tag" != "$cargo_ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $cargo_ver"
            exit 1
          fi

      - name: Build (aarch64 + x86_64)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package binaries
        run: |
          version="${GITHUB_REF#refs/tags/}"
          mkdir -p dist

          # Per-arch tarballs.
          for arch in aarch64 x86_64; do
            tar -C "target/${arch}-apple-darwin/release" -czf \
              "dist/${BIN}-${version}-${arch}-apple-darwin.tar.gz" "${BIN}"
          done

          # Universal (fat) binary via lipo.
          lipo -create -output "dist/${BIN}" \
            "target/aarch64-apple-darwin/release/${BIN}" \
            "target/x86_64-apple-darwin/release/${BIN}"
          tar -C dist -czf "dist/${BIN}-${version}-universal-apple-darwin.tar.gz" "${BIN}"
          rm -f "dist/${BIN}"

          # Checksums: a per-asset .sha256 (consumed by the self-update
          # feature, which verifies before replacing the binary) plus a
          # combined SHA256SUMS manifest.
          cd dist
          for f in *.tar.gz; do
            shasum -a 256 "$f" > "${f}.sha256"
          done
          shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Attest build provenance
        # Cryptographically attests these artifacts were built by this workflow.
        # Verify with: gh attestation verify <file> --repo MattJackson/claude-usage
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS

      - name: Bump Homebrew tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          version="${GITHUB_REF#refs/tags/}"      # e.g. v0.1.1
          ver="${version#v}"                       # e.g. 0.1.1
          sum="$(shasum -a 256 "dist/${BIN}-${version}-universal-apple-darwin.tar.gz" | awk '{print $1}')"

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

          git clone git@github.com:MattJackson/homebrew-tap.git tap
          f="tap/Formula/${BIN}.rb"
          url="https://github.com/MattJackson/claude-usage/releases/download/${version}/${BIN}-${version}-universal-apple-darwin.tar.gz"
          sed -i '' -E "s|^  url .*|  url \"${url}\"|" "$f"
          sed -i '' -E "s|^  sha256 .*|  sha256 \"${sum}\"|" "$f"
          sed -i '' -E "s|^  version .*|  version \"${ver}\"|" "$f"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already up to date"
          else
            git commit -am "${BIN} ${ver}"
            git push origin HEAD:main
          fi
