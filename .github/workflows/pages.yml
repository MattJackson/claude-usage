name: Deploy website to GitHub Pages

# Build the Astro marketing site under web/ and deploy the dist/ to
# GitHub Pages. Runs on pushes to main (production deploy) and to the
# feat/website branch (preview build only — no deploy) so we can prove
# the site keeps building green while it's under active development.
on:
  push:
    branches: [main, feat/website]
  workflow_dispatch:

# One deploy at a time; cancel a superseded in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload built site as Pages artifact
        # Only main deploys — but every branch build uploads the artifact so
        # broken builds fail loudly instead of silently.
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
