name: Hero screenshots

# Renders the website screenshots of usagio's real menu UI on all three OSes,
# using fixed mocked account fixtures (packaging/screenshots/fixtures/*.json —
# 2 Claude + 3-4 Codex accounts per fixture, in various states: healthy,
# weekly-locked, session-locked, mixed) so the images are reproducible
# regardless of the developer's real account state and never rely on
# hand-drawn mockups. Each OS leg renders the top-level menu headlessly via
# `usagio __render_shot <theme>` (muri's offscreen renderer, issue #59) — no
# live tray, accessibility, or display needed — producing 4 menu variants per
# OS x 3 OSes = 12 screenshots per run: <os>-menu-healthy.png,
# <os>-menu-locked.png, <os>-menu-session-locked.png, <os>-menu-mixed.png.
# See packaging/screenshots/fixtures/README.md for what each variant
# demonstrates and which website surface consumes it.
#
# Triggered on every push to `qa` (the pre-release staging branch) and on
# every `vX.Y.Z` release tag, plus manual dispatch for one-off re-renders
# (which only run `capture`, not the auto-commit-to-main step — see
# `commit-screenshots` below). Does NOT run on `dev` pushes or on pull
# requests — this is a release-asset job, not part of the fast CI lane in
# ci.yml.
#
# See packaging/screenshots/README.md for the full explanation of the
# per-OS capture approach (menu-visible vs. full dropdown), the "capture
# quality standards" (framing/resolution/crop position) every variant is
# post-processed to meet, and the honest limitations of headless CI capture
# on each platform.
#
# Full pipeline: app updates -> push to qa (iteration) or a vX.Y.Z release
# tag -> this workflow captures all 12 screenshots -> `commit-screenshots`
# pushes web/public/screenshots/<os>-<variant>.png straight to `main` (the
# branch .github/workflows/pages.yml actually deploys from — see that
# file's `deploy` job condition) as github-actions[bot] -> pages.yml's own
# push-to-main trigger picks that commit up and redeploys the site. No
# manual download/copy step anywhere in this chain. Requires the repo's
# Settings > Actions > General > Workflow permissions to be set to "Read
# and write permissions" (one-time repo config, not a code change; see
# packaging/screenshots/README.md).
# MANUAL / ARTIFACT-ONLY. This workflow renders the menu headlessly via
# `__render_shot` and uploads the PNGs as run artifacts for a quick cross-OS
# look — it does NOT push to `main`. Website screenshots come from the REAL
# capture pipeline in `packaging/qa-screenshots/` (live app on real desktops /
# EC2 VMs), which is the single source of truth for `web/public/screenshots/`.
# An earlier version of this workflow auto-committed these offscreen renders to
# `main` on every `qa` push / release tag, which repeatedly overwrote the real
# captures with flat-canvas mock-looking renders — hence triggers + the
# commit-to-main job were removed. Run it by hand from the Actions tab only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  capture:
    name: capture screenshots (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Linux build deps as ci.yml. Capture is now a headless
      # `__render_shot` (muri offscreen renderer), so the old display/capture
      # tools (Xvfb, xdotool, ImageMagick, stalonetray) are no longer needed.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev pkg-config libsecret-1-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --release
        run: cargo build --release --all-features

      # render_fixture.py (resolves NOW+ countdown tokens) and
      # postprocess.py (crop/resize to the 1600x900 hero frame) both need
      # Pillow; render_fixture.py itself only needs the stdlib.
      - name: Install screenshot post-processing deps (Linux/macOS)
        if: matrix.os != 'windows-latest'
        # macos-latest's system Python is PEP 668 (externally-managed), so a
        # bare `pip install pillow` errors out. The runner is ephemeral, so
        # `--break-system-packages` is the least-fuss unblock — no venv setup
        # to thread through the rest of the job.
        run: python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow

      - name: Install screenshot post-processing deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: Capture screenshots (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/screenshots/capture-macos.sh
          packaging/screenshots/capture-macos.sh "$RUNNER_TEMP/shots"

      - name: Capture screenshots (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x packaging/screenshots/capture-linux.sh
          packaging/screenshots/capture-linux.sh "$RUNNER_TEMP/shots"

      - name: Capture screenshots (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          packaging/screenshots/capture-windows.ps1 -OutDir "$env:RUNNER_TEMP/shots"

      - name: Determine artifact name
        id: os_slug
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest) echo "slug=macos" >> "$GITHUB_OUTPUT" ;;
            ubuntu-latest) echo "slug=linux" >> "$GITHUB_OUTPUT" ;;
            windows-latest) echo "slug=windows" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ steps.os_slug.outputs.slug }}
          path: |
            ${{ runner.temp }}/shots/${{ steps.os_slug.outputs.slug }}-*.png
          if-no-files-found: error
          retention-days: 30
